        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        *, *::before, *::after {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #212B36;
            color: #fff;
            padding-bottom: 30px;
            font-size: 14px;
        }

        /* Header */
        .header {
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo img {
            height: 40px;
            display: block;
        }

        .menu-icon {
            width: 20px;
            height: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            width: 100%;
        }

        /* Container */
        .container {
            max-width: 480px;
            margin: 0 auto;
            background-color: black;
        }

        /* Card principal */
        .contact-card {
            background: #212B36;
            border-radius: 14px 14px 0px 0px;
            padding: 20px 18px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        }

        /* Título do card */
        .contact-title {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 22px;
        }

        .contact-title .title-icon {
            width: 22px;
            height: 22px;
            background: #fff;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .contact-title .title-icon svg {
            width: 14px;
            height: 14px;
            fill: #000;
        }

        .contact-title .title-text {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .contact-title h1 {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
        }

        .contact-title .subtitle {
            font-size: 0.8rem;
            color: #8894A1;
            font-weight: 400;
        }

        /* Texto de introdução */
        .contact-intro {
            font-size: 0.95rem;
            font-weight: 600;
            color: #fff;
            line-height: 1.45;
            margin-bottom: 24px;
        }

        /* Campos do formulário */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.82rem;
            color: #b8b8b8;
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            background: transparent;
            border: 1px solid #424a50;
            border-radius: 10px;
            padding: 14px 16px;
            color: #fff;
            font-size: 0.92rem;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #626b73;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #2ecc71;
            box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.15);
        }

        .form-group textarea {
            resize: vertical;
            min-height: 130px;
            line-height: 1.5;
        }

        /* Select customizado */
        .form-group select {
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b8b8b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 14px center;
            background-size: 16px;
            padding-right: 44px;
            cursor: pointer;
        }

        .form-group select option {
            background: #212B36;
            color: #fff;
        }

        /* Campo de telefone com bandeira */
        .phone-input-wrapper {
            display: flex;
            align-items: center;
            border: 1px solid #424a50;
            border-radius: 10px;
            overflow: hidden;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .phone-input-wrapper:focus-within {
            border-color: #2ecc71;
            box-shadow: 0 0 0 2px rgba(46, 204, 113, 0.15);
        }

        .phone-flag {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 10px 14px 16px;
            cursor: pointer;
            border-right: 1px solid #424a50;
            user-select: none;
            flex-shrink: 0;
            font-size: 1rem;
        }

        .phone-flag .arrow {
            font-size: 0.7rem;
            color: #8894A1;
            margin-left: 2px;
        }

        .phone-input-wrapper input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 14px 16px;
            color: #fff;
            font-size: 0.92rem;
            outline: none;
            font-family: inherit;
            min-width: 0;
        }

        .phone-input-wrapper input::placeholder {
            color: #626b73;
        }

        /* Botão Enviar */
        .submit-btn {
            width: 100%;
            background: #198754;
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 16px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            font-family: inherit;
            margin-top: 10px;
            transition: background 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            background: #146c43;
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        .submit-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* ===== MENU DRAWER ===== */
        .menu-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.35s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .menu-drawer.active { transform: translateY(0); }

        .menu-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 30px;
            flex-shrink: 0;
        }

        .menu-drawer-header .logo img { height: 40px; display: block; }

        .menu-drawer-close {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            padding: 5px 10px;
        }

        .menu-drawer-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 0px;
            margin: 0px 17px;
            border-bottom: 1px solid #222;
            border-top: 1px solid #222;
        }

        .menu-drawer-profile .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-drawer-profile .avatar svg {
            width: 28px;
            height: 28px;
            fill: #888;
        }

        .menu-drawer-profile .info { flex: 1; min-width: 0; }

        .menu-drawer-profile .info .name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-drawer-profile .info .phone {
            font-size: 0.85rem;
            color: #fff;
        }

        .menu-drawer-list {
            flex: 1;
            padding-left: 17px;
            padding-right: 17px;
        }

        .menu-drawer-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 17px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;

        .menu-drawer-footer {

            font-weight: 600;
            cursor: pointer;

            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
        }

        .menu-drawer-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .menu-drawer-version {
            text-align: center;
            color: #666;
            font-size: 0.75rem;
            padding-bottom: 20px;
        }

        /* Modal Login */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.555);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #212B36;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .checkout-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-right: 25px;
        }

        .checkout-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .modal-close {
            position: absolute;
            right: 20px;
            top: 20px;
            background: transparent;
            border: none;
            color: #9099a1;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .checkout-field { margin-bottom: 20px; }

        .checkout-field input {
            width: 100%;
            background: transparent;
            border: 1px solid #424a50;
            border-radius: 8px;
            padding: 14px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .checkout-field input:focus { border-color: #27ae60; }

        .checkout-submit {
            width: 100%;
            background: #198754;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;

        /* Rodapé Social */
        .social-footer {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 0;
        }

        .social-footer .css-1yjo05o {

            gap: 10px;

        .social-footer .css-1yjo05o svg {
            width: 30px;
            height: 30px;
            padding: 5px;
            box-sizing: border-box;
            color: #fff;
            border-radius: 5px;
            transition: transform 0.2s ease;

        .social-footer .css-1yjo05o svg:nth-child(1) { background-color: #395693; }
        .social-footer .css-1yjo05o svg:nth-child(2) { background-color: #428ef1; }
        .social-footer .css-1yjo05o svg:nth-child(3) { background-color: #2494de; }
        .social-footer .css-1yjo05o svg:nth-child(4) { background-color: #25D366; }
        .social-footer .css-1yjo05o svg:hover { transform: scale(1.1); }

        @media (min-width: 500px) {
            body {
                max-width: 480px;
                margin: 0 auto;
                border-left: 1px solid #222;
                border-right: 1px solid #222;
                min-height: 100vh;
            }
        }
    </style>

            <form id="contactForm" onsubmit="enviarFormulario(event)">

                <div class="form-group">
                    <input type="text" id="contatoNome" placeholder="Nome*" required>
                </div>

                <div class="form-group">
                    <input type="email" id="contatoEmail" placeholder="E-mail" autocomplete="email">
                </div>

                <div class="form-group">
                    <div class="phone-input-wrapper">
                        <div class="phone-flag">
                            🇧🇷 <span class="arrow">▾</span>
                        </div>
                        <input type="tel" id="contatoTelefone" placeholder="Telefone" maxlength="15" inputmode="numeric" required>
                    </div>
                </div>

                <div class="form-group">
                    <select id="contatoAssunto" required>
                        <option value="" disabled selected>Selecione um assunto</option>
                        <option value="duvida">Dúvida</option>
                        <option value="problema">Problema com pedido</option>
                        <option value="pagamento">Pagamento</option>
                        <option value="premio">Premiação</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>

                <div class="form-group">
                    <textarea id="contatoMensagem" placeholder="Digite sua mensagem aqui.*" required></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Enviar
                    <svg viewBox="0 0 24 24">
                        <path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
                    </svg>
                </button>

            </form>

        </div>

    </div>

    <!-- ===== MODAL LOGIN ===== -->
    <div class="modal-overlay" id="checkoutModalOverlay">
        <div class="modal-content">
            <div class="checkout-header">
                <h2 id="checkoutModalTitle">🔐 Entrar</h2>
                <button class="modal-close" onclick="closeCheckout()">✕</button>
            </div>

            <div class="checkout-field">
                <input type="text" id="nomeInput" placeholder="Seu nome completo" maxlength="60" autocomplete="off">
            </div>
            <div class="checkout-field">
                <input type="tel" id="telefoneInput" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric" autocomplete="off">
            </div>
            <div class="checkout-field">
                <input type="text" id="cpfInput" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" autocomplete="off">
            </div>

            <button class="checkout-submit" onclick="concluirReserva()">Concluir</button>
        </div>
    </div>

    <script>
        const AUTH_COOKIE = 'rifa_auth_token';

        // ===== COOKIES =====
        function setCookie(name, value, days) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            return document.cookie.split('; ').reduce((r, v) => {
                const parts = v.split('=');
                return parts[0] === name ? decodeURIComponent(parts[1]) : r;
            }, '');
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        function formatarNome(nome) {
            if (!nome) return 'Cliente';
            const partes = nome.trim().split(/\s+/);
            if (partes.length === 1) return partes[0];
            return `${partes[0]} ${partes[partes.length - 1]}`;
        }

        function formatarTelefone(tel) {
            if (!tel) return '(00) 0****-****';
            const t = tel.replace(/\D/g, '');
            if (t.length === 11) return `(${t.slice(0, 2)}) ${t[2]}****-${t.slice(-4)}`;
            if (t.length === 10) return `(${t.slice(0, 2)}) ****-${t.slice(-4)}`;
            return tel;
        }

        // ===== MENU DRAWER =====
        function openMenuDrawer() {
            document.getElementById('menuDrawer').classList.add('active');
            document.body.style.overflow = 'hidden';
            atualizarMenuDrawer();
        }

        function closeMenuDrawer() {
            document.getElementById('menuDrawer').classList.remove('active');
            document.body.style.overflow = '';
        }

        function atualizarMenuDrawer() {
            const profile = document.getElementById('menuDrawerProfile');
            const btnText = document.getElementById('menuDrawerBtnText');

            const token = getCookie(AUTH_COOKIE);
            const nome = getCookie('rifa_nome') || '';
            const telefone = getCookie('rifa_telefone') || '';

            if (token && nome) {
                profile.style.display = 'flex';
                document.getElementById('menuDrawerName').textContent = formatarNome(nome);
                document.getElementById('menuDrawerPhone').textContent = formatarTelefone(telefone);
                btnText.textContent = 'Sair';
            } else {
                profile.style.display = 'none';
                btnText.textContent = 'Entrar';
            }
        }

        function menuAcaoPrincipal() {
            const token = getCookie(AUTH_COOKIE);

            if (token) {
                deleteCookie(AUTH_COOKIE);
                deleteCookie('rifa_nome');
                deleteCookie('rifa_telefone');
                deleteCookie('rifa_cpf');
                deleteCookie('rifa_qty');
                closeMenuDrawer();
                setTimeout(() => location.reload(), 300);
            } else {
                closeMenuDrawer();
                setTimeout(() => openLogin(), 300);
            }
        }

        function menuNavegar(url) {
            if (url === '#' || !url) {
                alert('Em breve!');
                return;
            }
            window.location.href = url;
        }

        // ===== MODAL LOGIN =====
        function openLogin() {
            document.getElementById('checkoutModalTitle').textContent = '🔐 Entrar';
            document.getElementById('checkoutModalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';

            const nomeSalvo = getCookie('rifa_nome');
            const telSalvo = getCookie('rifa_telefone');
            const cpfSalvo = getCookie('rifa_cpf');

            if (nomeSalvo) document.getElementById('nomeInput').value = nomeSalvo;
            if (telSalvo) {
                let v = telSalvo;
                if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
                else v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                document.getElementById('telefoneInput').value = v;
            }
            if (cpfSalvo) {
                let v = cpfSalvo.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
                document.getElementById('cpfInput').value = v;
            }
        }

        function closeCheckout() {
            document.getElementById('checkoutModalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function concluirReserva() {
            const nome = document.getElementById('nomeInput').value.trim();
            const telefone = document.getElementById('telefoneInput').value.replace(/\D/g, '');
            const cpf = document.getElementById('cpfInput').value.replace(/\D/g, '');

            if (nome.length < 3) { alert('Informe seu nome completo.'); return; }
            if (telefone.length < 10) { alert('Informe um telefone válido.'); return; }
            if (cpf.length !== 11) { alert('Informe um CPF válido.'); return; }

            const token = 'tk_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
            setCookie(AUTH_COOKIE, token, 1);
            setCookie('rifa_cpf', cpf, 1);
            setCookie('rifa_nome', nome, 1);
            setCookie('rifa_telefone', telefone, 1);

            closeCheckout();
            atualizarMenuDrawer();
        }

        // ===== MÁSCARAS =====
        const cpfInput = document.getElementById('cpfInput');
        if (cpfInput) {
            cpfInput.addEventListener('input', function (e) {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
                else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
                else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
                e.target.value = v;
            });
        }

        const telefoneInput = document.getElementById('telefoneInput');
        if (telefoneInput) {
            telefoneInput.addEventListener('input', function (e) {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
                else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
                else if (v.length > 0) v = v.replace(/(\d{0,2})/, '($1');
                e.target.value = v;
            });
        }

        // ============================================================
        // MÁSCARA DO TELEFONE DE CONTATO
        // ============================================================
        const contatoTelefone = document.getElementById('contatoTelefone');
        if (contatoTelefone) {
            contatoTelefone.addEventListener('input', function (e) {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
                else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
                else if (v.length > 0) v = v.replace(/(\d{0,2})/, '($1');
                e.target.value = v;
            });
        }

        // ============================================================
        // ENVIAR FORMULÁRIO DE CONTATO
        // ============================================================
        function enviarFormulario(event) {
            event.preventDefault();

            const nome = document.getElementById('contatoNome').value.trim();
            const email = document.getElementById('contatoEmail').value.trim();
            const telefone = document.getElementById('contatoTelefone').value.replace(/\D/g, '');
            const assunto = document.getElementById('contatoAssunto').value;
            const mensagem = document.getElementById('contatoMensagem').value.trim();

            // Validações
            if (nome.length < 3) { alert('Informe seu nome.'); return; }
            if (telefone.length < 10) { alert('Informe um telefone válido.'); return; }
            if (!assunto) { alert('Selecione um assunto.'); return; }
            if (mensagem.length < 5) { alert('Digite sua mensagem.'); return; }

            // Monta a mensagem do WhatsApp
            const texto = `*Contato - Suporte*\n\n` +
                `*Nome:* ${nome}\n` +
                (email ? `*E-mail:* ${email}\n` : '') +
                `*Telefone:* ${telefone}\n` +
                `*Assunto:* ${assunto}\n\n` +
                `*Mensagem:*\n${mensagem}`;

            // 🔽🔽🔽 Troque pelo número do WhatsApp da sua empresa 🔽🔽🔽
            const numeroWhatsApp = '5511999999999'; // exemplo: 55 + DDD + número

            const url = `https://wa.me/${numeroWhatsApp}?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');

            // Feedback visual
            const btn = event.target.querySelector('.submit-btn');
            const original = btn.innerHTML;
            btn.innerHTML = '✅ Enviado!';
            btn.style.background = '#146c43';
            setTimeout(() => {
                btn.innerHTML = original;
                btn.style.background = '#198754';
                document.getElementById('contactForm').reset();
            }, 2000);
        }

        // ===== INICIALIZA =====
        document.addEventListener('DOMContentLoaded', function () {
            atualizarMenuDrawer();
        });

        document.getElementById('checkoutModalOverlay')?.addEventListener('click', function (e) {
            if (e.target.id === 'checkoutModalOverlay') closeCheckout();
        });
    </script>
</body>

</html>
