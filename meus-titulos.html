        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        *,
        *::before,
        *::after {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #212B36;
            color: #fff;
            padding-bottom: 30px;
            font-size: 14px;
        }

        /* Header */
        .header {
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }

        .logo img {
            height: 40px;
            display: block;
        }

        .menu-icon {
            width: 20px;
            height: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            width: 100%;
        }

        /* Container */
        .container {
            padding: 15px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* ===== AVISO (caixa amarela) ===== */
        .alert-box {
            background: #7A4F01;
            border-radius: 12px;
            padding: 18px 20px;
            padding-bottom: 5px;
            margin-bottom: 22px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
        }

        .alert-box .alert-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 6px;
        }

        .alert-box .alert-title svg {
            width: 22px;
            height: 22px;
            fill: #FFD54F;
            flex-shrink: 0;
        }

        .alert-box .alert-sub {
            font-size: 0.9rem;
            color: #F5E1A4;
            margin-bottom: 14px;
            padding-left: 32px;
        }

        .alert-box .alert-list {
            list-style: none;
            padding-left: 32px;
            margin-bottom: 14px;
        }

        .alert-box .alert-list li {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            font-size: 0.88rem;
            color: #FFF3CC;
            line-height: 1.5;
            margin-bottom: 6px;
        }

        .alert-box .alert-list li::before {
            content: "❌";
            flex-shrink: 0;
            font-size: 0.85rem;
        }

        .alert-box .alert-footer {
            font-size: 0.88rem;
            color: #FFF3CC;
            line-height: 1.5;
        }

        /* ===== Título da página ===== */
        .page-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 15px;
            padding-left: 2px;
        }

        .page-title svg {
            width: 20px;
            height: 20px;
            fill: #fff;
        }

        /* ===== Lista de títulos ===== */
        .tickets-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .ticket-card {
            display: flex;
            gap: 12px;
            align-items: center;
            background: #1a222c;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
            text-decoration: none;
            color: inherit;
        }

        .ticket-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }

        .ticket-card img {
            width: 68px;
            height: 68px;
            object-fit: cover;
            border-radius: 10px;
            flex-shrink: 0;
            background: #0d1117;
        }

        .ticket-info {
            flex: 1;
            min-width: 0;
        }

        .ticket-date {
            font-size: 0.7rem;
            color: #8894A1;
            margin-bottom: 3px;
        }

        .ticket-title {
            font-size: 0.88rem;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .ticket-status {
            font-size: 0.78rem;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .ticket-status.expirado {
            color: #e74c3c;
        }

        .ticket-status.pago {
            color: #2ecc71;
        }

        .ticket-status.aguardando {
            color: #f1c40f;
        }

        .ticket-meta {
            font-size: 0.75rem;
            color: #b8b8b8;
            line-height: 1.4;
        }

        .ticket-meta strong {
            color: #fff;
            font-weight: 600;
        }

        .ticket-arrow {
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #8894A1;
            flex-shrink: 0;
        }

        .ticket-arrow svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        /* Vazio */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #8894A1;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            fill: #4a5560;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        /* ===== MENU DRAWER (tela cheia) ===== */
        .menu-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.35s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .menu-drawer.active {
            transform: translateY(0);
        }

        .menu-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 30px;
            flex-shrink: 0;
        }

        .menu-drawer-header .logo img {
            height: 40px;
            display: block;
        }

        .menu-drawer-close {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            padding: 5px 10px;
        }

        .menu-drawer-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 0px;
            margin: 0px 17px;
            border-bottom: 1px solid #222;
            border-top: 1px solid #222;
        }

        .menu-drawer-profile .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-drawer-profile .avatar svg {
            width: 28px;
            height: 28px;
            fill: #888;
        }

        .menu-drawer-profile .info {
            flex: 1;
            min-width: 0;
        }

        .menu-drawer-profile .info .name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-drawer-profile .info .phone {
            font-size: 0.85rem;
            color: #fff;
        }

        .menu-drawer-list {
            flex: 1;
            padding-left: 17px;
            padding-right: 17px;
        }

        .menu-drawer-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 17px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
            border-bottom: solid 1px #222;
        }

        .menu-drawer-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .menu-drawer-item.active {
            background: rgba(25, 135, 84, 0.15);
            color: #5BE584;
        }

        .menu-drawer-item .icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: inherit;
        }

        .menu-drawer-item .icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .menu-drawer-footer {
            flex-shrink: 0;
            margin-bottom: 10px;
            padding: 0 17px;
        }

        .menu-drawer-btn {
            width: 100%;
            background: #198754;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
        }

        .menu-drawer-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .menu-drawer-version {
            text-align: center;
            color: #666;
            font-size: 0.75rem;
            padding-bottom: 20px;
        }

        /* ===== MODAL CHECKOUT / LOGIN ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.555);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: #212B36;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .checkout-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-right: 25px;
        }

        .checkout-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .modal-close {
            position: absolute;
            right: 20px;
            top: 20px;
            background: transparent;
            border: none;
            color: #9099a1;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .checkout-field {
            margin-bottom: 20px;
        }

        .checkout-field input {
            width: 100%;
            background: transparent;
            border: 1px solid #424a50;
            border-radius: 8px;
            padding: 14px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .checkout-field input:focus {
            border-color: #27ae60;
        }

        .checkout-submit {
            width: 100%;
            background: #198754;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* Rodapé Social */
        .social-footer {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 0;
        }

        .social-footer .css-1yjo05o {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social-footer .css-1yjo05o svg {
            width: 30px;
            height: 30px;
            padding: 5px;
            box-sizing: border-box;
            color: #fff;
            border-radius: 5px;
            transition: transform 0.2s ease;
        }

        .social-footer .css-1yjo05o svg:nth-child(1) {
            background-color: #395693;
        }

        .social-footer .css-1yjo05o svg:nth-child(2) {
            background-color: #428ef1;
        }

        .social-footer .css-1yjo05o svg:nth-child(3) {
            background-color: #2494de;
        }

        .social-footer .css-1yjo05o svg:nth-child(4) {
            background-color: #25D366;
        }

        .social-footer .css-1yjo05o svg:hover {
            transform: scale(1.1);
        }

        @media (min-width: 500px) {
            body {
                max-width: 480px;
                margin: 0 auto;
                border-left: 1px solid #222;
                border-right: 1px solid #222;
                min-height: 100vh;
            }
        }
    </style>
</head>

                        d="M22.56,16.3 L14.89,3.58 C14.2597186,2.59400001 13.1702353,1.99737652 12,1.99737652 C10.8297647,1.99737652 9.74028139,2.59400001 9.11,3.58 L1.44,16.3 C0.888546003,17.2192471 0.869485343,18.3628867 1.39,19.3 C1.99197363,20.3551378 3.11522982,21.0046397 4.33,21 L19.67,21 C20.8765042,21.0128744 21.9978314,20.3797441 22.61,19.34 C23.146086,18.3926382 23.1269508,17.2292197 22.56,16.3 L22.56,16.3 Z M12,17 C11.4477153,17 11,16.5522847 11,16 C11,15.4477153 11.4477153,15 12,15 C12.5522847,15 13,15.4477153 13,16 C13,16.5522847 12.5522847,17 12,17 Z M13,13 C13,13.5522847 12.5522847,14 12,14 C11.4477153,14 11,13.5522847 11,13 L11,9 C11,8.44771525 11.4477153,8 12,8 C12.5522847,8 13,8.44771525 13,9 L13,13 Z">
                    </path>

                ATENÇÃO!!!
            </div>
            <div class="alert-sub">Para a sua segurança:</div>
            <ul class="alert-list">
                <li>Não fazemos chamada de vídeo.</li>
                <li>Não pedimos para espelhar sua tela.</li>
                <li>Não cobramos nenhuma taxa para liberar prêmios.</li>
                <div class="alert-footer" style="margin-top: 20px;">
                Se alguém solicitar qualquer uma dessas ações, desconfie. Pode ser golpe!
            </div>
            </ul>
            
        </div>

        <!-- ===== Título ===== -->
        <h1 class="page-title">
            <svg viewBox="0 0 24 24">
                <path
                    d="M9 20c0 1.1-.9 2-2 2s-2-.9-2-2s.9-2 2-2s2 .9 2 2m8-2c-1.1 0-2 .9-2 2s.9 2 2 2s2-.9 2-2s-.9-2-2-2m-9.8-3.2v-.1l.9-1.7h7.4c.7 0 1.4-.4 1.7-1l3.9-7l-1.7-1l-3.9 7h-7L4.3 2H1v2h2l3.6 7.6L5.2 14c-.1.3-.2.6-.2 1c0 1.1.9 2 2 2h12v-2H7.4c-.1 0-.2-.1-.2-.2M18 2.8l-1.4-1.4l-4.8 4.8l-2.6-2.6L7.8 5l4 4z" />
            </svg>
            Meus títulos
        </h1>

        <!-- ===== Lista de títulos ===== -->
        <!-- <div class="tickets-list" id="ticketsList">
        </div> -->

    </div>


    <!-- ===== MODAL CHECKOUT / LOGIN ===== -->
    <div class="modal-overlay" id="checkoutModalOverlay">
        <div class="modal-content">
            <div class="checkout-header">
                <h2 id="checkoutModalTitle">🔐 Entrar</h2>
                <button class="modal-close" onclick="closeCheckout()">✕</button>
            </div>

            <div class="checkout-field">
                <input type="text" id="nomeInput" placeholder="Seu nome completo" maxlength="60" autocomplete="off">
            </div>
            <div class="checkout-field">
                <input type="tel" id="telefoneInput" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric"
                    autocomplete="off">
            </div>
            <div class="checkout-field">
                <input type="text" id="cpfInput" placeholder="000.000.000-00" maxlength="14" inputmode="numeric"
                    autocomplete="off">
            </div>

            <button class="checkout-submit" onclick="concluirReserva()">Concluir</button>
        </div>
    </div>

    <script>
        // ============================================================
        // CONFIGURAÇÃO
        // ============================================================
        const AUTH_COOKIE = 'rifa_auth_token';

        // ============================================================
        // COOKIES
        // ============================================================
        function setCookie(name, value, days) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            return document.cookie.split('; ').reduce((r, v) => {
                const parts = v.split('=');
                return parts[0] === name ? decodeURIComponent(parts[1]) : r;
            }, '');
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        function isLoggedIn() {
            return !!getCookie(AUTH_COOKIE);
        }

        function formatarNome(nome) {
            if (!nome) return 'Cliente';
            const partes = nome.trim().split(/\s+/);
            if (partes.length === 1) return partes[0];
            return `${partes[0]} ${partes[partes.length - 1]}`;
        }

        function formatarTelefone(tel) {
            if (!tel) return '(00) 0****-****';
            const t = tel.replace(/\D/g, '');
            if (t.length === 11) return `(${t.slice(0, 2)}) ${t[2]}****-${t.slice(-4)}`;
            if (t.length === 10) return `(${t.slice(0, 2)}) ****-${t.slice(-4)}`;
            return tel;
        }

        // ============================================================
        // MENU DRAWER
        // ============================================================
        function openMenuDrawer() {
            document.getElementById('menuDrawer').classList.add('active');
            document.body.style.overflow = 'hidden';
            atualizarMenuDrawer();
        }

        function closeMenuDrawer() {
            document.getElementById('menuDrawer').classList.remove('active');
            document.body.style.overflow = '';
        }

        function atualizarMenuDrawer() {
            const profile = document.getElementById('menuDrawerProfile');
            const btnText = document.getElementById('menuDrawerBtnText');

            const token = getCookie(AUTH_COOKIE);
            const nome = getCookie('rifa_nome') || '';
            const telefone = getCookie('rifa_telefone') || '';

            if (token && nome) {
                profile.style.display = 'flex';
                document.getElementById('menuDrawerName').textContent = formatarNome(nome);
                document.getElementById('menuDrawerPhone').textContent = formatarTelefone(telefone);
                btnText.textContent = 'Sair';
            } else {
                profile.style.display = 'none';
                btnText.textContent = 'Entrar';
            }
        }

        function menuAcaoPrincipal() {
            const token = getCookie(AUTH_COOKIE);

            if (token) {
                deleteCookie(AUTH_COOKIE);
                deleteCookie('rifa_nome');
                deleteCookie('rifa_telefone');
                deleteCookie('rifa_cpf');
                deleteCookie('rifa_qty');
                closeMenuDrawer();
                setTimeout(() => location.reload(), 300);
            } else {
                closeMenuDrawer();
                setTimeout(() => openLogin(), 300);
            }
        }

        function menuNavegar(url) {
            if (url === '#' || !url) {
                alert('Em breve!');
                return;
            }
            window.location.href = url;
        }

        // ============================================================
        // MODAL DE LOGIN
        // ============================================================
        function openLogin() {
            document.getElementById('checkoutModalTitle').textContent = '🔐 Entrar';
            document.getElementById('checkoutModalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';

            const nomeSalvo = getCookie('rifa_nome');
            const telSalvo = getCookie('rifa_telefone');
            const cpfSalvo = getCookie('rifa_cpf');

            if (nomeSalvo) document.getElementById('nomeInput').value = nomeSalvo;
            if (telSalvo) {
                let v = telSalvo;
                if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
                else v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                document.getElementById('telefoneInput').value = v;
            }
            if (cpfSalvo) {
                let v = cpfSalvo.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
                document.getElementById('cpfInput').value = v;
            }
        }

        function closeCheckout() {
            document.getElementById('checkoutModalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function concluirReserva() {
            const nome = document.getElementById('nomeInput').value.trim();
            const telefone = document.getElementById('telefoneInput').value.replace(/\D/g, '');
            const cpf = document.getElementById('cpfInput').value.replace(/\D/g, '');

            if (nome.length < 3) { alert('Informe seu nome completo.'); return; }
            if (telefone.length < 10) { alert('Informe um telefone válido.'); return; }
            if (cpf.length !== 11) { alert('Informe um CPF válido.'); return; }

            const token = 'tk_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
            setCookie(AUTH_COOKIE, token, 1);
            setCookie('rifa_cpf', cpf, 1);
            setCookie('rifa_nome', nome, 1);
            setCookie('rifa_telefone', telefone, 1);

            closeCheckout();
            atualizarMenuDrawer();
            carregarTitulos();
        }

        // ============================================================
        // MÁSCARAS
        // ============================================================
        const cpfInput = document.getElementById('cpfInput');
        if (cpfInput) {
            cpfInput.addEventListener('input', function (e) {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
                else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
                else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
                e.target.value = v;
            });
        }

        const telefoneInput = document.getElementById('telefoneInput');
        if (telefoneInput) {
            telefoneInput.addEventListener('input', function (e) {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
                else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
                else if (v.length > 0) v = v.replace(/(\d{0,2})/, '($1');
                e.target.value = v;
            });
        }

        // ============================================================
        // CARREGAR TÍTULOS
        // ============================================================
        function carregarTitulos() {
            const container = document.getElementById('ticketsList');
            const token = getCookie(AUTH_COOKIE);

            if (!token) {
                // Não logado → mostra aviso
                container.innerHTML = `
                    <div class="empty-state">
                        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
                        <p>Faça login para ver seus títulos.</p>
                    </div>
                `;
                return;
            }

            // 🎯 Aqui você pode buscar os títulos REAIS de uma API
            // Por enquanto, vamos mostrar títulos de exemplo (como no print)

            // 🔽🔽🔽 EXEMPLO — substitua por dados da API 🔽🔽🔽
            const titulosExemplo = [
                {
                    data: '13/10/2026 às 01:55',
                    campanha: 'AÇÃO RELÂMPAGO 2.0 ⚡',
                    status: 'expirado',
                    statusTexto: 'Expirado',
                    quantidade: 12,
                    total: '1,22',
                    imagem: 'https://sp1-s3.saveincloud.io/gelmotos-pbglfl/a379410d-c1bd-4342-97a8-a137816b6a6f.jpeg'
                },
                {
                    data: '10/10/2026 às 21:02',
                    campanha: 'AÇÃO RELÂMPAGO 2.0 ⚡',
                    status: 'expirado',
                    statusTexto: 'Expirado',
                    quantidade: 12,
                    total: '1,22',
                    imagem: 'https://sp1-s3.saveincloud.io/gelmotos-pbglfl/a379410d-c1bd-4342-97a8-a137816b6a6f.jpeg'
                }
            ];
            // 🔼🔼🔼 FIM DO EXEMPLO 🔼🔼🔼

            // Renderiza
            container.innerHTML = '';
            titulosExemplo.forEach(t => {
                const card = document.createElement('a');
                card.href = 'javascript:void(0)';
                card.className = 'ticket-card';
                card.onclick = () => alert('Detalhes do pedido em breve!');
                card.innerHTML = `
                    <img src="${t.imagem}" alt="${t.campanha}">
                    <div class="ticket-info">
                        <div class="ticket-date">${t.data}</div>
                        <div class="ticket-title">${t.campanha}</div>
                        <div class="ticket-status ${t.status}">${t.statusTexto}</div>
                        <div class="ticket-meta">Quantidade: <strong>${t.quantidade}</strong></div>
                        <div class="ticket-meta">Total: <strong>R$ ${t.total}</strong></div>
                    </div>
                    <div class="ticket-arrow">
                        <svg viewBox="0 0 24 24"><path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6z"/></svg>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        // ============================================================
        // INICIALIZA
        // ============================================================
        document.addEventListener('DOMContentLoaded', function () {
            atualizarMenuDrawer();
            carregarTitulos();
        });

        document.getElementById('checkoutModalOverlay')?.addEventListener('click', function (e) {
            if (e.target.id === 'checkoutModalOverlay') closeCheckout();
        });
    </script>
</body>
