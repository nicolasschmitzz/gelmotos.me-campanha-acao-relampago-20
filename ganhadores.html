<html lang="pt-BR">

<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        *, *::before, *::after {
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #212B36;
            color: #fff;
            padding-bottom: 30px;
            font-size: 14px;
        }

        /* Header */
        .header {
            background: #000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid #222;
        }

        .logo img {
            height: 40px;
            display: block;
        }

        .menu-icon {
            width: 20px;
            height: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .menu-icon span {
            display: block;
            height: 2px;
            background: #fff;
            border-radius: 2px;
            width: 100%;
        }

        /* Container */
        .container {
            padding: 15px;
            max-width: 480px;
            margin: 0 auto;
        }

        /* Título da página */
        .page-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.05rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 18px;
            padding-left: 2px;
        }

        .page-title .emoji {
            font-size: 1.2rem;
            line-height: 1;
        }

        /* Lista de ganhadores */
        .winners-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .winner-item {
            display: flex;
            gap: 14px;
            background: #212B36;
            border-radius: 12px;
            padding: 14px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .winner-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }

        /* Foto do ganhador */
        .winner-photo {
            width: 80px;
            height: 80px;
            border-radius: 10px;
            background: #e8e8e8;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .winner-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Placeholder caso não tenha imagem */
        .winner-photo.placeholder svg {
            width: 40px;
            height: 40px;
            fill: #b0b0b0;
        }

        /* Informações */
        .winner-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .winner-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 3px;
            line-height: 1.25;
            word-break: break-word;
        }

        .winner-campaign {
            font-size: 0.9rem;
            font-weight: 600;
            color: #5BE584;
            margin-bottom: 5px;
            line-height: 1.25;
            word-break: break-word;
        }

        .winner-detail {
            font-size: 0.78rem;
            color: #b8b8b8;
            line-height: 1.5;
            word-break: break-word;
        }

        .winner-detail strong {
            color: #d0d0d0;
            font-weight: 500;
        }

        /* ===== MENU DRAWER ===== */
        .menu-drawer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 2000;
            transform: translateY(-100%);
            transition: transform 0.35s ease;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .menu-drawer.active { transform: translateY(0); }

        .menu-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 30px;
            flex-shrink: 0;
        }

        .menu-drawer-header .logo img { height: 40px; display: block; }

        .menu-drawer-close {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.6rem;
            font-weight: 300;
            cursor: pointer;
            line-height: 1;
            padding: 5px 10px;
        }

        .menu-drawer-profile {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 18px 0px;
            margin: 0px 17px;
            border-bottom: 1px solid #222;
            border-top: 1px solid #222;
        }

        .menu-drawer-profile .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .menu-drawer-profile .avatar svg {
            width: 28px;
            height: 28px;
            fill: #888;
        }

        .menu-drawer-profile .info { flex: 1; min-width: 0; }

        .menu-drawer-profile .info .name {
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-drawer-profile .info .phone {
            font-size: 0.85rem;
            color: #fff;
        }

        .menu-drawer-list {
            flex: 1;
            padding-left: 17px;
            padding-right: 17px;
        }

        .menu-drawer-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 17px;
            color: #fff;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            font-family: inherit;
            border-bottom: solid 1px #222;
        }

        .menu-drawer-item:hover { background: rgba(255, 255, 255, 0.05); }

        .menu-drawer-item.active {
            background: rgba(25, 135, 84, 0.15);
            color: #5BE584;
        }

        .menu-drawer-item .icon {
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: inherit;
        }

        .menu-drawer-item .icon svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .menu-drawer-footer {
            flex-shrink: 0;
            margin-bottom: 10px;
            padding: 0 17px;
        }

        .menu-drawer-btn {
            width: 100%;
            background: #198754;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: inherit;
        }

        .menu-drawer-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .menu-drawer-version {
            text-align: center;
            color: #666;
            font-size: 0.75rem;
            padding-bottom: 20px;
        }

        /* Modal Checkout/Login */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.555);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 3000;
            padding: 20px;
            backdrop-filter: blur(3px);
        }

        .modal-overlay.active { display: flex; }

        .modal-content {
            background: #212B36;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 20px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .checkout-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-right: 25px;
        }

        .checkout-header h2 {
            font-size: 1.1rem;
            font-weight: 600;
            color: #fff;
        }

        .modal-close {
            position: absolute;
            right: 20px;
            top: 20px;
            background: transparent;
            border: none;
            color: #9099a1;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .checkout-field { margin-bottom: 20px; }

        .checkout-field input {
            width: 100%;
            background: transparent;
            border: 1px solid #424a50;
            border-radius: 8px;
            padding: 14px 15px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .checkout-field input:focus { border-color: #27ae60; }

        .checkout-submit {
            width: 100%;
            background: #198754;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
        }

        /* Rodapé Social */
        .social-footer {
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 20px 0;
        }

        .social-footer .css-1yjo05o {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .social-footer .css-1yjo05o svg {
            width: 30px;
            height: 30px;
            padding: 5px;
            box-sizing: border-box;
            color: #fff;
            border-radius: 5px;
            transition: transform 0.2s ease;
        }

        .social-footer .css-1yjo05o svg:nth-child(1) { background-color: #395693; }
        .social-footer .css-1yjo05o svg:nth-child(2) { background-color: #428ef1; }
        .social-footer .css-1yjo05o svg:nth-child(3) { background-color: #2494de; }
        .social-footer .css-1yjo05o svg:nth-child(4) { background-color: #25D366; }
        .social-footer .css-1yjo05o svg:hover { transform: scale(1.1); }

        @media (min-width: 500px) {
            body {
                max-width: 480px;
                margin: 0 auto;
                border-left: 1px solid #222;
                border-right: 1px solid #222;
                min-height: 100vh;
            }
        }
    </style>

    <!-- ===== MODAL LOGIN ===== -->
    <div class="modal-overlay" id="checkoutModalOverlay">
        <div class="modal-content">
            <div class="checkout-header">
                <h2 id="checkoutModalTitle">🔐 Entrar</h2>
                <button class="modal-close" onclick="closeCheckout()">✕</button>
            </div>

            <div class="checkout-field">
                <input type="text" id="nomeInput" placeholder="Seu nome completo" maxlength="60" autocomplete="off">
            </div>
            <div class="checkout-field">
                <input type="tel" id="telefoneInput" placeholder="(00) 00000-0000" maxlength="15" inputmode="numeric" autocomplete="off">
            </div>
            <div class="checkout-field">
                <input type="text" id="cpfInput" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" autocomplete="off">
            </div>

            <button class="checkout-submit" onclick="concluirReserva()">Concluir</button>
        </div>
    </div>

    <script>
        const AUTH_COOKIE = 'rifa_auth_token';

        // ===== COOKIES =====
        function setCookie(name, value, days) {
            const expires = new Date(Date.now() + days * 864e5).toUTCString();
            document.cookie = `${name}=${encodeURIComponent(value)}; expires=${expires}; path=/; SameSite=Lax`;
        }

        function getCookie(name) {
            return document.cookie.split('; ').reduce((r, v) => {
                const parts = v.split('=');
                return parts[0] === name ? decodeURIComponent(parts[1]) : r;
            }, '');
        }

        function deleteCookie(name) {
            document.cookie = `${name}=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=/;`;
        }

        function formatarNome(nome) {
            if (!nome) return 'Cliente';
            const partes = nome.trim().split(/\s+/);
            if (partes.length === 1) return partes[0];
            return `${partes[0]} ${partes[partes.length - 1]}`;
        }

        function formatarTelefone(tel) {
            if (!tel) return '(00) 0****-****';
            const t = tel.replace(/\D/g, '');
            if (t.length === 11) return `(${t.slice(0, 2)}) ${t[2]}****-${t.slice(-4)}`;
            if (t.length === 10) return `(${t.slice(0, 2)}) ****-${t.slice(-4)}`;
            return tel;
        }

        // ===== MENU DRAWER =====
        function openMenuDrawer() {
            document.getElementById('menuDrawer').classList.add('active');
            document.body.style.overflow = 'hidden';
            atualizarMenuDrawer();
        }

        function closeMenuDrawer() {
            document.getElementById('menuDrawer').classList.remove('active');
            document.body.style.overflow = '';
        }

        function atualizarMenuDrawer() {
            const profile = document.getElementById('menuDrawerProfile');
            const btnText = document.getElementById('menuDrawerBtnText');

            const token = getCookie(AUTH_COOKIE);
            const nome = getCookie('rifa_nome') || '';
            const telefone = getCookie('rifa_telefone') || '';

            if (token && nome) {
                profile.style.display = 'flex';
                document.getElementById('menuDrawerName').textContent = formatarNome(nome);
                document.getElementById('menuDrawerPhone').textContent = formatarTelefone(telefone);
                btnText.textContent = 'Sair';
            } else {
                profile.style.display = 'none';
                btnText.textContent = 'Entrar';
            }
        }

        function menuAcaoPrincipal() {
            const token = getCookie(AUTH_COOKIE);

            if (token) {
                deleteCookie(AUTH_COOKIE);
                deleteCookie('rifa_nome');
                deleteCookie('rifa_telefone');
                deleteCookie('rifa_cpf');
                deleteCookie('rifa_qty');
                closeMenuDrawer();
                setTimeout(() => location.reload(), 300);
            } else {
                closeMenuDrawer();
                setTimeout(() => openLogin(), 300);
            }
        }

        function menuNavegar(url) {
            if (url === '#' || !url) {
                alert('Em breve!');
                return;
            }
            window.location.href = url;
        }

        // ===== MODAL LOGIN =====
        function openLogin() {
            document.getElementById('checkoutModalTitle').textContent = '🔐 Entrar';
            document.getElementById('checkoutModalOverlay').classList.add('active');
            document.body.style.overflow = 'hidden';

            const nomeSalvo = getCookie('rifa_nome');
            const telSalvo = getCookie('rifa_telefone');
            const cpfSalvo = getCookie('rifa_cpf');

            if (nomeSalvo) document.getElementById('nomeInput').value = nomeSalvo;
            if (telSalvo) {
                let v = telSalvo;
                if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
                else v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                document.getElementById('telefoneInput').value = v;
            }
            if (cpfSalvo) {
                let v = cpfSalvo.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
                document.getElementById('cpfInput').value = v;
            }
        }

        function closeCheckout() {
            document.getElementById('checkoutModalOverlay').classList.remove('active');
            document.body.style.overflow = '';
        }

        function concluirReserva() {
            const nome = document.getElementById('nomeInput').value.trim();
            const telefone = document.getElementById('telefoneInput').value.replace(/\D/g, '');
            const cpf = document.getElementById('cpfInput').value.replace(/\D/g, '');

            if (nome.length < 3) { alert('Informe seu nome completo.'); return; }
            if (telefone.length < 10) { alert('Informe um telefone válido.'); return; }
            if (cpf.length !== 11) { alert('Informe um CPF válido.'); return; }

            const token = 'tk_' + Date.now() + '_' + Math.random().toString(36).substring(2, 15);
            setCookie(AUTH_COOKIE, token, 1);
            setCookie('rifa_cpf', cpf, 1);
            setCookie('rifa_nome', nome, 1);
            setCookie('rifa_telefone', telefone, 1);

            closeCheckout();
            atualizarMenuDrawer();
        }

        // ===== MÁSCARAS =====
        const cpfInput = document.getElementById('cpfInput');
        if (cpfInput) {
            cpfInput.addEventListener('input', function (e) {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 9) v = v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
                else if (v.length > 6) v = v.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
                else if (v.length > 3) v = v.replace(/(\d{3})(\d{0,3})/, '$1.$2');
                e.target.value = v;
            });
        }

        const telefoneInput = document.getElementById('telefoneInput');
        if (telefoneInput) {
            telefoneInput.addEventListener('input', function (e) {
                let v = e.target.value.replace(/\D/g, '');
                if (v.length > 11) v = v.slice(0, 11);
                if (v.length > 10) v = v.replace(/(\d{2})(\d{5})(\d{0,4})/, '($1) $2-$3');
                else if (v.length > 6) v = v.replace(/(\d{2})(\d{4})(\d{0,4})/, '($1) $2-$3');
                else if (v.length > 2) v = v.replace(/(\d{2})(\d{0,5})/, '($1) $2');
                else if (v.length > 0) v = v.replace(/(\d{0,2})/, '($1');
                e.target.value = v;
            });
        }
